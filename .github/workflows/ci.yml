name: CI

# Sprint 1 (Plan 3): minimal test-on-push CI. Deploy gates, previews, and a
# status page stay in Sprint 10. Every command here is verified to pass locally.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-go:
    name: Core API (go build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradebridge
          POSTGRES_PASSWORD: tradebridge
          POSTGRES_DB: tradebridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradebridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration suite skips unless this is set (test/integration/db_test.go).
      TEST_DATABASE_URL: postgres://tradebridge:tradebridge@localhost:5432/tradebridge?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Uses the toolchain pinned in go.mod (1.26.4). If GitHub's runners do
          # not yet offer that version, pin `go-version` here to an available one.
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        # Relies on actions/setup-go@v5 having added $(go env GOPATH)/bin to PATH
        # so the installed `migrate` binary is found below. Keep setup-go at v5+.
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Apply migrations
        run: migrate -path pkg/db/migrations -database "$TEST_DATABASE_URL" up

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  core-web:
    name: Buyer web (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  web-image:
    name: Web Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build --build-arg NEXT_PUBLIC_CORE_URL=https://api.example.com -t tradebridge-web web/
