version: "2"
sql:
  - engine: "postgresql"
    schema: "pkg/db/migrations"
    queries: "pkg/db/query"
    gen:
      go:
        package: "sqlc"
        out: "pkg/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
