version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive

  exclusions:
    paths:
      # Next.js frontend deps ship stray .go files (e.g. flatted) — not our code.
      - "web/"
      - "node_modules"
    rules:
      # sqlc/wire generated code is not ours to lint.
      - path: pkg/db/sqlc/
        linters: [revive, staticcheck, unused]
      - path: internal/di/wire_gen.go
        linters: [revive, unused]

run:
  timeout: 5m
