services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tradebridge
      POSTGRES_PASSWORD: tradebridge
      POSTGRES_DB: tradebridge
    ports:
      # Host 5442 -> container 5432 (host 5432 is used by another local stack).
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # Host 6389 -> container 6379 (keeps clear of other local Redis instances).
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
